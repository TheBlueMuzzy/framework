# Framework checks on GitHub (F70): every push re-runs each module's own checks — the same ones install-module.mjs
# runs before a module may go into a game — so a red module is seen here before anyone installs it.
# One job per module, side by side. The linter's one setup lives at the framework root (eslint.config.js), so that
# gets installed first; each module then installs its own packages and runs test / typecheck / check-ui / lint.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still going
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every module = every folder with a kit/VERSION — found, not typed in, so a new module can't be left unchecked
  # (the Saves module went 9 commits unchecked here because the list was typed by hand, 2026-10-19)
  modules:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
      starters: ${{ steps.find.outputs.starters }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          echo "list=$(ls -d */kit/VERSION | cut -d/ -f1 | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "starters=$(ls -d starters/*/package.json | cut -d/ -f2 | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  module:
    needs: modules
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one red module doesn't hide the others' results
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.module }}/package-lock.json

      - name: Install the linter (framework root)
        run: npm ci

      - name: Install the module's packages
        working-directory: ${{ matrix.module }}
        run: npm ci

      # Some module tests open a real browser (ui-kit's layout checks; saves in all three engines, F150): Playwright's
      # own browsers, never a system Chrome. A module names the engines it needs in package.json "testBrowsers"
      # (default: Chromium only) — saves: "chromium webkit firefox"
      - id: browsers
        name: Which test browsers
        working-directory: ${{ matrix.module }}
        run: |
          if [ -d node_modules/playwright-core ]; then
            echo "needed=yes" >> "$GITHUB_OUTPUT"
            echo "list=$(node -p "require('./package.json').testBrowsers || 'chromium'")" >> "$GITHUB_OUTPUT"
          fi

      # Browsers + their Linux packages are kept between runs (.github/actions/test-browsers, F158). Two timeouts on
      # 2026-10-27 were Ubuntu's mirror at 26 kB/s, not the browsers. A normal install takes 1–4 min; kept, under 1.
      - name: Browsers for tests that need them
        if: steps.browsers.outputs.needed == 'yes'
        timeout-minutes: 15
        uses: ./.github/actions/test-browsers
        with:
          folder: ${{ matrix.module }}
          browsers: ${{ steps.browsers.outputs.list }}

      # Only the checks this module has (the same list install-module.mjs runs)
      - name: Module checks
        working-directory: ${{ matrix.module }}
        run: |
          for check in test typecheck check-ui lint; do
            if node -e "process.exit(require('./package.json').scripts?.['$check'] ? 0 : 1)"; then
              echo "::group::npm run $check"
              npm run "$check"
              echo "::endgroup::"
            fi
          done

  # The starters play today's modules (F65 — Framework test game): a starter holds COPIES of the modules made when they
  # were installed, so scripts/starter-check.mjs copies it, installs every module fresh from this push into the copy and
  # runs the starter's check:full there (unit tests, lint, build, UI rules, then two tabs online through a local room server,
  # the Dev Kit live, a smoke round, every module's promises, every screen at 7 sizes). A module change whose own tests
  # pass but that breaks a game turns this red — before any game takes the update.
  starter:
    needs: modules
    name: starter ${{ matrix.starter }} (fresh modules)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        starter: ${{ fromJSON(needs.modules.outputs.starters) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            starters/${{ matrix.starter }}/package-lock.json
            */package-lock.json

      # The copy borrows these (one link per package), so they're installed once, here
      - name: Install the starter's packages
        working-directory: starters/${{ matrix.starter }}
        run: npm ci

      # A module's installer may use the module's own packages (crashes' reads source maps with 'source-map')
      - name: Install every module's packages (their installers run)
        run: |
          for module in $(ls -d */kit/VERSION | cut -d/ -f1); do
            echo "::group::npm ci in $module"
            (cd "$module" && npm ci)
            echo "::endgroup::"
          done

      # The starter pins playwright-core (1.63.0) — its own CLI installs the Chromium that version needs
      # (`npx playwright` would fetch the newest Playwright and a browser the pinned one can't use). Kept between runs.
      - name: Chromium for the starter's browser checks
        timeout-minutes: 15
        uses: ./.github/actions/test-browsers
        with:
          folder: starters/${{ matrix.starter }}
          cli: playwright-core

      - name: Starter checks with fresh modules
        run: node scripts/starter-check.mjs ${{ matrix.starter }} full
