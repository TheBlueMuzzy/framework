# Test browsers for a folder's browser tests (F158 — Keep test browsers on GitHub), shared by every job that needs them.
# The slow part was never the browsers: it's the Linux packages they need, fetched from Ubuntu's mirror — 13 MB took
# 8 min 19 s on 2026-10-27, and the saves job timed out at 15 min twice that day. So both are kept between runs:
#   ~/.cache/ms-playwright  the browsers themselves
#   ~/apt-cache             the Linux package files (.deb) the browsers need
# keyed on the Playwright version + the engines, so a Playwright update starts a fresh cache.
# A stalled package download now gives up after 30 s and tries again (3 times), instead of hanging the job.
name: Test browsers
description: Installs Playwright's browsers and their Linux packages, kept between runs

inputs:
  folder:
    description: The folder whose packages hold Playwright (its node_modules/playwright-core)
    required: true
  cli:
    description: Which Playwright command installs them — playwright, or playwright-core for a folder that pins only that
    default: playwright
  browsers:
    description: Engines to install, space-separated
    default: chromium

runs:
  using: composite
  steps:
    - id: version
      shell: bash
      working-directory: ${{ inputs.folder }}
      run: |
        echo "playwright=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "engines=$(echo '${{ inputs.browsers }}' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/ms-playwright
          ~/apt-cache
        key: test-browsers-${{ runner.os }}-pw${{ steps.version.outputs.playwright }}-${{ steps.version.outputs.engines }}

    # apt keeps the files it fetched (so they can be saved), and a stalled download retries instead of hanging
    - shell: bash
      run: |
        printf '%s\n' 'APT::Keep-Downloaded-Packages "true";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
          | sudo tee /etc/apt/apt.conf.d/99-test-browsers > /dev/null
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
        mkdir -p ~/apt-cache
        if ls ~/apt-cache/*.deb > /dev/null 2>&1; then
          echo "Kept from an earlier run: $(ls ~/apt-cache/*.deb | wc -l) Linux packages"
          sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/
        fi

    # Browsers already in ~/.cache/ms-playwright are skipped; packages already in apt's folder aren't fetched again
    - shell: bash
      working-directory: ${{ inputs.folder }}
      run: npx ${{ inputs.cli }} install --with-deps ${{ inputs.browsers }}

    - shell: bash
      if: steps.cache.outputs.cache-hit != 'true'
      run: cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/ms-playwright
          ~/apt-cache
        key: ${{ steps.cache.outputs.cache-primary-key }}
